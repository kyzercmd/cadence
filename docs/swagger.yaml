    - GenderFemale
  models.GetProjectResponse:
    properties:
      code:
        type: string
      createdAt:
        type: string
      deadline:
        type: string
      description:
        type: string
      id:
        type: string
      imageUrl:
        type: string
      memberIds:
        items:
          type: string
        type: array
      name:
        type: string
      priority:
        $ref: '#/definitions/models.Priority'
      startDate:
        type: string
      status:
        $ref: '#/definitions/models.ProjectStatus'
    type: object
  models.HRUpdateEmployeePayload:
    properties:
      active:
        type: boolean
      avatarUrl:
        type: string
      birthday:
        type: string
      company:
        type: string
      gender:
        $ref: '#/definitions/models.Gender'
      level:
        $ref: '#/definitions/models.Level'
      location:
        type: string
      mobile:
        type: string
      name:
        type: string
      skype:
        type: string
    type: object
  models.Level:
    enum:
    - Junior
    - Middle
    - Senior
    type: string
    x-enum-varnames:
    - LevelJunior
    - LevelMiddle
    - LevelSenior
  models.LogTimePayload:
    properties:
      hours:
        type: number
    type: object
  models.LoginPayload:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  models.MyTaskResponse:
    properties:
      dueDate:
        type: string
      id:
        type: string
      priority:
        $ref: '#/definitions/models.Priority'
      projectName:
        type: string
      status:
        $ref: '#/definitions/models.TaskStatus'
      taskName:
        type: string
    type: object
  models.Priority:
    enum:
    - low
    - medium
    - high
    type: string
    x-enum-varnames:
    - PriorityLow
    - PriorityMedium
    - PriorityHigh
  models.ProjectStatus:
    enum:
    - active
    - completed
    type: string
    x-enum-varnames:
    - ProjectStatusActive
    - ProjectStatusCompleted
  models.RefreshPayload:
    properties:
      refreshtoken:
        type: string
