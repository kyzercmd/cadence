      attachments:
        items:
          type: string
        type: array
      description:
        type: string
      dueDate:
        type: string
      estimateHours:
        type: number
      id:
        type: string
      links:
        items:
          type: string
        type: array
      name:
        type: string
      priority:
        $ref: '#/definitions/models.Priority'
      projectId:
        type: string
      status:
        $ref: '#/definitions/models.TaskStatus'
      totalSpentHours:
        type: number
    type: object
  models.TaskStatus:
    enum:
    - todo
    - in_progress
    - in_review
    - done
    type: string
    x-enum-varnames:
    - TaskStatusTodo
    - TaskStatusInProgress
    - TaskStatusInReview
    - TaskStatusDone
  models.UpdateSelfPayload:
